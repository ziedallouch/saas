---
# Copy to hosts.yml and fill in. hosts.yml is gitignored.
all:
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519
    ansible_become: false        # already root

    # Pin the version. "latest" makes rebuilds non-reproducible and is how you end up
    # with two nodes on different minor versions.
    k3s_version: v1.31.5+k3s1

    # Advertised API server address — must be reachable from node-2 and your laptop.
    k3s_api_host: 192.168.152.230

    # Extra SANs on the API server certificate. Add any hostname you will put in a
    # kubeconfig; adding one later means regenerating the serving certificate.
    k3s_tls_san:
      - 192.168.152.230
      - k8s.erp.lan


    # The k3s SELinux policy, pinned. The installer skips fetching this whenever
    # INSTALL_K3S_SKIP_DOWNLOAD is set, so the playbook installs it directly.
    # Bump the el9 / version to match the VMs' RHEL major release if it changes.
    k3s_selinux_rpm: https://rpm.rancher.io/k3s/stable/common/centos/9/noarch/k3s-selinux-1.6-1.el9.noarch.rpm

    k3s_cluster_cidr: 10.42.0.0/16
    k3s_service_cidr: 10.43.0.0/16

  children:
    k3s_server:
      hosts:
        erp-node-1:
          ansible_host: 192.168.152.230
          # k3s takes the node name from the hostname. Both your VMs are currently
          # called "localhost" — see the "cloned VMs" section of the README.
          node_hostname: erp-node-1
          node_labels:
            erp.devsty.io/role: data

    k3s_agent:
      hosts:
        erp-node-2:
          ansible_host: 192.168.152.231
          node_hostname: erp-node-2
          node_labels:
            erp.devsty.io/role: apps
